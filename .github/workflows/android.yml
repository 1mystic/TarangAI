name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "docs/**", "*.md"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.TARANG_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tarang.jks"
          echo "TARANG_KEYSTORE_FILE=$RUNNER_TEMP/tarang.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          TARANG_VERSION_CODE: ${{ github.run_number }}
          TARANG_KEYSTORE_PASSWORD: ${{ secrets.TARANG_KEYSTORE_PASSWORD }}
          TARANG_KEY_ALIAS: ${{ secrets.TARANG_KEY_ALIAS }}
          TARANG_KEY_PASSWORD: ${{ secrets.TARANG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        id: apks
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$f" .apk)
            abi=${name#app-}; abi=${abi%-release}
            cp "$f" "dist/Tarang-${abi}.apk"
          done
          ls -la dist
          {
            echo "### Tarang APKs"
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tarang-apks
          path: dist/*.apk
          if-no-files-found: error

      # Every push publishes a downloadable pre-release for its branch;
      # pushing a v* tag publishes a proper release.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          NOTES="Automatic build of \`$GITHUB_REF_NAME\` @ ${GITHUB_SHA::7}. Most phones: install **Tarang-arm64-v8a.apk**. Not sure? Use **Tarang-universal.apk**."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            gh release create "$TAG" dist/*.apk --title "Tarang $TAG" --generate-notes --latest
          elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            # Rolling stable build: keeps /releases/latest/download/<apk> links (used by the website) working.
            gh release delete latest --cleanup-tag -y 2>/dev/null || true
            gh release create latest dist/*.apk --latest --target "$GITHUB_SHA" \
              --title "Tarang · latest build $GITHUB_RUN_NUMBER" --notes "$NOTES"
          else
            SAFE=$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd '[:alnum:]-._')
            TAG="preview-$SAFE"
            gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
            gh release create "$TAG" dist/*.apk --prerelease --target "$GITHUB_SHA" \
              --title "Tarang preview · $GITHUB_REF_NAME · build $GITHUB_RUN_NUMBER" \
              --notes "$NOTES"
          fi
